[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ytclipper"
version = "0.1.0"
description = "Automatically find and clip the best moments from YouTube videos and livestreams"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "yt-dlp>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ytclipper = "ytclipper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ytclipper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
